<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
</head>
<body>
    <h1 id="titulo">Cadastro de Aluno</h1>

    <input type="text" id="nome" placeholder="Digite seu nome"><br>
    <input type="number" id="idade" placeholder="Digite sua idade"><br>
    <input type="text" id="curso" placeholder="Digite o curso"><br>
    <input type="text" id="matricula" placeholder="Digite a matrícula"><br>

    <button id="botaoCadastrar">Cadastrar Aluno</button>

    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
