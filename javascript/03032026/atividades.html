<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades</title>
    <link rel="stylesheet" href="atividades.css">
</head>
<body>
    <h1>Atividade 1 - Mudar cor do título</h1>
    <h1 class="h1">Titulo da página</h1>
    <button class="deixar_azul">Mudar a cor para azul</button>
    <button class="deixar_vermelho">Mudar a cor para vermelho</button>
    <br>

    <hr>

    <h1>Atividade 2 - parágrafo invisivel</h1>
    <button id="btn">Mostrar / Ocultar</button>
    <p id="text">Parágrafo que será ocultado</p>
    <br>

    <hr>

    <h1>Atividade 3 - Contador de caracteres</h1>
    <textarea id="textarea"></textarea>
    <p id="contador">0 caracteres</p>
    <br>

    <hr>

    <h1>Atividade 4 - Adicionar itens a lista</h1>
    <button id="botao">Clique!</button>
    <p id="cliques">0 cliques</p>
    <br>

    <hr>

    <h1>Atividade 5/6 - Criar e excluir elementos dinamicamente</h1>
    <input type="text" id="input" placeholder="Digite algo">
    <button id="adicionar">Adicionar</button>
    <ul id="lista"></ul>
    <br>

    <hr>

    <h1>Desafio Hard!</h1>
    <input type="text" id="nome" placeholder="Digite seu nome">
    <button id="enviarNome">Enviar</button>
    <p id="mensagemNome"></p>


    <script src="atividades.js"></script>
</body>
</html>
